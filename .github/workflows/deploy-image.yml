name: Personal Image

# Builds the branch this fork deploys from and pushes it to GHCR. Separate from
# build.yml and docker-publish.yml so nothing here can reach upstream's registry
# or interfere with a release: those two only ever run for main and develop.
on:
  push:
    branches: [ develop-personal ]
  workflow_dispatch:

# A newer push supersedes an in-flight build of the same branch.
concurrency:
  group: personal-image-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

    - name: Log in to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate tags
      id: tags
      shell: bash
      run: |
        set -euo pipefail

        image="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
        sha="$(git rev-parse --short HEAD)"

        {
          echo 'tags<<EOF'
          echo "${image}:${GITHUB_REF_NAME}"
          echo "${image}:sha-${sha}"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    # Dockerfile.build runs yarn typecheck, the frontend build and the backend
    # publish, so a broken frontend fails here rather than at runtime.
    - name: Build and push
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
      with:
        context: .
        file: ./Dockerfile.build
        platforms: linux/amd64
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
